[package]
name = "coin"
version = "0.1.0"
edition = "2021"
description = "A one-node coin: ledger, wallet, mempool, and miner"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
